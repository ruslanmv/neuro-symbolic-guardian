[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "1.0.0"
description = "Aegis: a production-ready neuro-symbolic verification & policy enforcement layer for LLM systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ruslan Magana Vsevolodovna"}]
keywords = ["llm", "neuro-symbolic", "z3", "constraint-checking", "policy", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "z3-solver>=4.12.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "colorama>=0.4.6",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.4.0"]
metrics = ["prometheus-client>=0.19.0"]

[project.scripts]
aegis = "aegis.cli:main"
ns-guardian = "ns_guardian.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
